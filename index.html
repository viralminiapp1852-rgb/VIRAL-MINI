<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Rewards</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Monetag Telegram Mini App SDK -->
  <script src="//libtl.com/sdk.js" data-zone="11723018" data-sdk="show_11723018"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #080706;
      --card-bg: #14110f;
      --card-border: #291f19;
      --accent-orange: #ff6a00;
      --accent-glow: #ff8c38;
      --text-main: #f8fafc;
      --text-muted: #9c9087;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { 
      background: radial-gradient(circle at top right, #241206 0%, var(--bg-color) 60%);
      color: var(--text-main); 
      padding: 16px; 
      min-height: 100vh;
      user-select: none; 
    }
    
    /* Top Bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .profile-card { 
      background: var(--card-bg); 
      padding: 8px 16px; 
      border-radius: 20px; 
      font-size: 14px; 
      font-weight: 600; 
      border: 1px solid var(--card-border);
      box-shadow: inset 0 0 8px rgba(255, 106, 0, 0.05);
    }
    
    .diamond-badge { 
      background: linear-gradient(135deg, #ff6a00, #d9480f); 
      border: none; 
      padding: 8px 18px; 
      border-radius: 20px; 
      font-size: 15px; 
      font-weight: bold; 
      color: #fff; 
      cursor: pointer; 
      box-shadow: 0 4px 14px rgba(255, 106, 0, 0.35);
      transition: transform 0.15s;
    }
    .diamond-badge:active { transform: scale(0.95); }
    
    /* Task Cards */
    .task-container { display: flex; flex-direction: column; gap: 14px; }
    .ad-card { 
      background: var(--card-bg); 
      padding: 16px; 
      border-radius: 14px; 
      border: 1px solid var(--card-border); 
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-title { font-weight: 600; font-size: 15px; letter-spacing: 0.5px; }
    .ad-badge { 
      font-size: 12px; 
      color: var(--accent-glow); 
      background: rgba(255, 106, 0, 0.1); 
      padding: 4px 10px; 
      border-radius: 8px; 
      font-weight: bold; 
      border: 1px solid rgba(255, 106, 0, 0.2); 
    }
    
    .action-btn { 
      width: 100%; 
      background: linear-gradient(135deg, #ff7a18, #af3c00); 
      color: #fff; 
      border: none; 
      padding: 12px; 
      border-radius: 10px; 
      font-weight: bold; 
      font-size: 14px; 
      cursor: pointer; 
      box-shadow: 0 3px 10px rgba(255, 106, 0, 0.25);
      transition: 0.2s; 
    }
    .action-btn:active { transform: scale(0.98); }
    .action-btn:disabled { 
      background: #1e1916; 
      color: #594d45; 
      cursor: not-allowed; 
      box-shadow: none; 
      transform: none; 
    }
    
    .progress-track { background: #0b0908; height: 8px; border-radius: 6px; margin-top: 12px; overflow: hidden; border: 1px solid #1f1814; }
    .progress-bar { background: linear-gradient(90deg, #ff6a00, #ff9248); height: 100%; width: 0%; transition: width 0.3s ease; }

    /* Daily Reset Notice */
    .reset-timer-badge {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    /* Wallet Popup */
    .modal-overlay { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(0, 0, 0, 0.88); 
      backdrop-filter: blur(4px);
      align-items: center; 
      justify-content: center; 
      padding: 16px; 
      z-index: 100; 
    }
    .modal-card { 
      background: var(--card-bg); 
      width: 100%; 
      max-width: 380px; 
      padding: 22px; 
      border-radius: 16px; 
      border: 1px solid var(--card-border); 
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
    }
    .option-item { 
      background: #0d0a09; 
      padding: 14px; 
      border-radius: 10px; 
      margin: 10px 0; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      cursor: pointer; 
      border: 1px solid var(--card-border); 
      transition: 0.2s; 
    }
    .option-item:hover, .option-item:active { border-color: var(--accent-orange); }
    
    .status-panel { 
      margin-top: 16px; 
      padding: 14px; 
      background: #0a0807; 
      border-radius: 10px; 
      font-size: 13px; 
      text-align: center; 
      border: 1px dashed var(--card-border); 
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="profile-card" id="user-display">👤 Player</div>
    <button class="diamond-badge" onclick="showWallet()">💎 <span id="diamond-counter">0</span></button>
  </div>

  <div class="reset-timer-badge">⚡ Tasks daily midnight ko auto-reset ho jate hain</div>

  <div class="task-container" id="tasks-wrapper"></div>

  <!-- Wallet Modal -->
  <div class="modal-overlay" id="wallet-popup">
    <div class="modal-card">
      <h3 style="font-size: 18px; color: var(--accent-glow);">Redeem Code Store</h3>
      <p style="font-size: 12px; color: var(--text-muted); margin: 6px 0 14px 0;">Apne diamonds exchange karein:</p>
      
      <div class="option-item" onclick="submitRedeemRequest(1200, 10)">
        <b>₹10 Code</b><span style="color:var(--accent-glow); font-weight:bold;">1,200 💎</span>
      </div>
      <div class="option-item" onclick="submitRedeemRequest(2300, 20)">
        <b>₹20 Code</b><span style="color:var(--accent-glow); font-weight:bold;">2,300 💎</span>
      </div>
      <div class="option-item" onclick="submitRedeemRequest(3000, 30)">
        <b>₹30 Code</b><span style="color:var(--accent-glow); font-weight:bold;">3,000 💎</span>
      </div>

      <div class="status-panel" id="request-display">Koi pending request nahi hai</div>
      <button class="action-btn" style="margin-top: 14px;" onclick="hideWallet()">Close</button>
    </div>
  </div>

<script>
  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDvC04b5_jmvpyxS-Yk2in0Uee3I8G5jd4",
    databaseURL: "https://amaibot-6736d-default-rtdb.firebaseio.com",
    projectId: "amaibot-6736d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Telegram User Init
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  const tgUser = tg?.initDataUnsafe?.user;
  const currentUserId = tgUser?.id ? String(tgUser.id) : "demo_user_test";
  const currentUserName = tgUser?.first_name || "Demo Player";
  document.getElementById("user-display").innerText = "👤 " + currentUserName;

  let totalDiamonds = 0;
  let buttonStates = [0, 0, 0, 0, 0];
  let lastActiveDay = "";

  // Helper: Get Today's Date String YYYY-MM-DD
  function getTodayString() {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  }

  buildButtons();

  // 1. IN-APP INTERSTITIAL INITIALIZATION (Runs in background)
  window.addEventListener("load", () => {
    if (typeof show_11723018 === "function") {
      try {
        show_11723018({
          type: 'inApp',
          inAppSettings: {
            frequency: 2,
            capping: 0.1,
            interval: 30,
            timeout: 5,
            everyPage: false
          }
        });
      } catch (err) {
        console.log("In-app Ad init:", err);
      }
    }
  });

  // 2. Database Sync & Daily Auto-Reset Check
  const userDatabaseRef = db.ref("users/" + currentUserId);
  userDatabaseRef.on("value", (snapshot) => {
    const data = snapshot.val();
    const today = getTodayString();

    if (data) {
      // Diamonds hamesha bachenge (kabhi reset nahi honge)
      totalDiamonds = data.diamonds || 0;
      document.getElementById("diamond-counter").innerText = totalDiamonds;

      // Agar din change ho gaya hai, to tasks ko 0 par reset kar do
      if (data.lastDate !== today) {
        buttonStates = [0, 0, 0, 0, 0];
        lastActiveDay = today;
        userDatabaseRef.update({
          tasks: buttonStates,
          lastDate: today
        });
      } else {
        buttonStates = data.tasks || [0, 0, 0, 0, 0];
        lastActiveDay = data.lastDate;
      }
      buildButtons();
    } else {
      // Pehli baar user login hua hai
      userDatabaseRef.set({
        name: currentUserName,
        diamonds: 0,
        tasks: [0, 0, 0, 0, 0],
        lastDate: today
      });
    }
  });

  // Withdraw Status Listener
  const requestDatabaseRef = db.ref("withdrawals/" + currentUserId);
  requestDatabaseRef.on("value", (snapshot) => {
    const data = snapshot.val();
    const statusBox = document.getElementById("request-display");
    if (!data) {
      statusBox.innerText = "Koi pending request nahi hai";
    } else if (data.status === "pending") {
      statusBox.innerHTML = `⏳ <b>₹${data.amount} Request Pending:</b><br><span style="color:var(--text-muted); font-size:12px;">Aapko 24 hours ke andar kabhi bhi code mil jayega.</span>`;
    } else if (data.status === "approved") {
      statusBox.innerHTML = `🎉 <b>Aapka Code Ready Hai:</b><br><code style="color:var(--accent-glow); font-size:16px; font-weight:bold; letter-spacing:1px;">${data.code}</code>`;
    }
  });

  function buildButtons() {
    const wrapper = document.getElementById("tasks-wrapper");
    wrapper.innerHTML = "";

    for (let i = 0; i < 5; i++) {
      const watched = buttonStates[i] || 0;
      const left = 5 - watched;
      const completed = left <= 0;
      const progressPercent = (watched / 5) * 100;

      wrapper.innerHTML += `
        <div class="ad-card">
          <div class="card-header">
            <span class="card-title">Mission #${i + 1}</span>
            <span class="ad-badge">${completed ? "Finished" : left + " ads left"}</span>
          </div>
          <button class="action-btn" id="task-btn-${i}" ${completed ? "disabled" : ""} onclick="handleWatchAd(${i})">
            ${completed ? "Mission Finished" : "Watch Ad (+10 💎)"}
          </button>
          <div class="progress-track">
            <div class="progress-bar" style="width: ${progressPercent}%;"></div>
          </div>
        </div>
      `;
    }
  }

  // Rewarded Interstitial Trigger (Button Click Par)
  function handleWatchAd(index) {
    const targetBtn = document.getElementById(`task-btn-${index}`);
    targetBtn.disabled = true;
    targetBtn.innerText = "Ad Loading...";

    if (typeof show_11723018 === "function") {
      show_11723018()
        .then(() => {
          buttonStates[index] = (buttonStates[index] || 0) + 1;
          totalDiamonds += 10;

          document.getElementById("diamond-counter").innerText = totalDiamonds;
          buildButtons();

          // Save progress & ensure lastDate is saved
          userDatabaseRef.update({
            name: currentUserName,
            diamonds: totalDiamonds,
            tasks: buttonStates,
            lastDate: getTodayString()
          });

          alert("🎉 Mubarak ho! 10 Diamonds add ho gaye.");
        })
        .catch((err) => {
          console.error("Ad Error / Skipped:", err);
          alert("Ad load nahi ho paya ya cancel ho gaya. Dobara koshish karein.");
          buildButtons();
        });
    } else {
      alert("Monetag Ad SDK connect ho raha hai. Kuch der baad click karein.");
      buildButtons();
    }
  }

  function showWallet() { document.getElementById("wallet-popup").style.display = "flex"; }
  function hideWallet() { document.getElementById("wallet-popup").style.display = "none"; }

  function submitRedeemRequest(requiredDiamonds, inrAmount) {
    if (totalDiamonds < requiredDiamonds) {
      alert("Aapke paas paryapt diamonds nahi hain!");
      return;
    }

    totalDiamonds -= requiredDiamonds;
    document.getElementById("diamond-counter").innerText = totalDiamonds;

    userDatabaseRef.update({ diamonds: totalDiamonds });

    requestDatabaseRef.set({
      userId: currentUserId,
      userName: currentUserName,
      amount: inrAmount,
      diamondsUsed: requiredDiamonds,
      status: "pending",
      code: "",
      submittedAt: new Date().toLocaleString()
    });

    alert("Request submit ho gayi! 24 ghante ke andar code mil jayega.");
  }
</script>
</body>
</html>
